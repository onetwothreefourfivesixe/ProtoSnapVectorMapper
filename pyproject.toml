[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "protosnap-vector-mapper"
version = "1.0.0"
description = "Generates ProtoSnap prototype skeletons from cuneiform font glyphs, with a review loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.1",
    "scipy>=1.10",
    "scikit-image>=0.22",
    "torch>=2.2",
    "torchvision>=0.17",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
protosnap = "protosnap.cli:main"

[tool.setuptools]
packages = ["protosnap", "protosnap.learned"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
